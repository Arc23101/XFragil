<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <script src="../JS/js_jwt.js"></script>
    <script src="../JS/index.js" defer></script>
    <link rel="stylesheet" href="../CSS/index.css">
    <title>Síndrome do X Frágil - Visão do Médico</title>
</head>
<body class="bg-medico">
    <div class="princpal">
        <div class="TopPad">
            <div class="titulo">
                <h2>ConectaFX • Portal Médico</h2>
            </div>
            <div class="button">
                <a href="telaMedConfig.html">
                    <button>Dados da conta</button>
                </a>
                <button type="button" onclick="sairDoSistema()">Sair</button>
            </div>
        </div>
        <div class="introducao">
            <div style="margin-bottom: 20px;">
                <h3 style="color: #0f172a; margin-bottom: 4px;">Acompanhamento Clínico de Pacientes</h3>
                <p style="color: #64748b; font-size: 0.9rem;">Selecione um paciente vinculado para analisar a pontuação e os indicadores observados.</p>
            </div>

            <div class="buttonPaci">
                <label for="filtro-pacientes">Selecione o paciente:</label>
                <div class="select-wrapper">
                    <select id="filtro-pacientes" class="custom-select" onchange="carregarDetalhesPaciente()">
                        <option value="">-- Selecione um paciente --</option>
                    </select>
                </div>
            </div>

            <div class="DadosPaci" id="lista-pacientes-container">
                <div class="tabela">
                    Selecione um paciente acima para visualizar os dados clínicos e observações.
                </div>
            </div>
        </div>
    </div>
</body>
</html>
