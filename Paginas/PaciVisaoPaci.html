<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <script src="../JS/index.js" defer></script>
    <link rel="stylesheet" href="../CSS/index.css">
    <title>Síndrome do X Frágil - Visão do Paciente</title>
</head>
<body class="bg-paciente-visao">
    <div class="princpal">
        <div class="TopPad">
            <div class="titulo">
                <h2>ConectaFX • Área do Paciente</h2>
            </div>
            <div class="button">
                <a href="telaPaciConfig.html">
                    <button>Dados da conta</button>
                </a>
                <a href="../index.html">
                    <button>Sair</button>
                </a>
            </div>
        </div>
        <div class="introducao">
            <div style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                <div>
                    <h3 style="color: #0f172a; margin-bottom: 4px;">Meus Pacientes Cadastrados</h3>
                    <p style="color: #64748b; font-size: 0.9rem;">Acompanhe as avaliações registradas ou inicie um novo questionário.</p>
                </div>
                <a href="Quiz.html">
                    <button type="button" class="btn-primario">+ Novo Paciente (Quiz)</button>
                </a>
            </div>

            <div class="buttonPaci">
                <label for="filtro-pacientes">Selecione o paciente:</label>
                <div class="select-wrapper">
                    <select id="filtro-pacientes" class="custom-select" onchange="carregarDetalhesPaciente()">
                        <option value="">-- Selecione um paciente --</option>
                    </select>
                </div>
            </div>

            <div class="DadosPaci" id="lista-pacientes-container">
                <div class="tabela">
                    Selecione um paciente acima ou cadastre um novo para visualizar as informações e respostas do questionário.
                </div>
            </div>
        </div>
    </div>
</body>
</html>
