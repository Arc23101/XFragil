<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <script src="../JS/js_jwt.js"></script>
    <script src="../JS/index.js" defer></script>
    <link rel="stylesheet" href="../CSS/index.css">
    <title>Configurações da Conta - Paciente</title>
</head>
<body class="bg-paciente-config">
    <div class="princpal">
        <div class="TopPad">
            <div class="titulo">
                <h2>ConectaFX • Configurações da Conta</h2>
            </div>
            <div class="button">
                <a href="PaciVisaoPaci.html">
                    <button>← Voltar aos Pacientes</button>
                </a>
            </div>
        </div>
        <div class="introducao">
            <div class="text1">
                <h3>Gerenciar Dados do Usuário</h3>
                <p style="color: #64748b; font-size: 0.9rem;">Mantenha seus dados de contato e segurança sempre atualizados.</p>

                <div class="tabela" style="margin-top: 15px;">
                    <div class="config-item">
                        <span><strong>E-mail cadastrado:</strong></span>
                        <button type="button" class="btn-pequeno" onclick="MudarEmail()">Alterar e-mail</button>
                    </div>
                    <div class="config-item">
                        <span><strong>Telefone cadastrado:</strong></span>
                        <button type="button" class="btn-pequeno" onclick="MudarTelefone()">Alterar telefone</button>
                    </div>
                    <div class="config-item">
                        <span><strong>Senha de acesso:</strong></span>
                        <button type="button" class="btn-pequeno" onclick="MudarSenha()">Alterar senha</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
