<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <script src="../JS/js_jwt.js"></script>
    <script src="../JS/index.js" defer></script>
    <link rel="stylesheet" href="../CSS/index.css">
    <title>Síndrome do X Frágil - Quiz (Parte 2)</title>
</head>
<body class="bg-paciente-visao">
    <div class="princpal">
        <div class="TopPad">
            <div class="titulo">
                <a href="PaciVisaoPaci.html">
                    <h2>ConectaFX • Questionário (Parte 2 de 2)</h2>
                </a>
            </div>
        </div>
        <div class="introducao">
            <div class="quiz">
                <h3 style="color: #0f172a; margin-bottom: 6px;">Características Clínicas e Comportamentais</h3>
                <p class="form-subtitulo" style="text-align: left;">Continue respondendo às perguntas de observação para finalizar o questionário do paciente.</p>

                <form id="formQuiz2">
                    <div class="questao-card">
                        <label>8. Evita contato visual ao conversar ou interagir?</label>
                        <div class="radio-opcoes">
                            <label><input type="radio" name="p8" value="Sim" required> Sim</label>
                            <label><input type="radio" name="p8" value="Nao"> Não</label>
                        </div>
                    </div>

                    <div class="questao-card">
                        <label>9. Evita contato físico ou demonstra incômodo ao ser tocado?</label>
                        <div class="radio-opcoes">
                            <label><input type="radio" name="p9" value="Sim" required> Sim</label>
                            <label><input type="radio" name="p9" value="Nao"> Não</label>
                        </div>
                    </div>

                    <div class="questao-card">
                        <label>10. Apresenta face alongada e mandíbula proeminente?</label>
                        <div class="radio-opcoes">
                            <label><input type="radio" name="p10" value="Sim" required> Sim</label>
                            <label><input type="radio" name="p10" value="Nao"> Não</label>
                        </div>
                    </div>

                    <div class="questao-card">
                        <label>11. Possui orelhas grandes ou proeminentes (em abano)?</label>
                        <div class="radio-opcoes">
                            <label><input type="radio" name="p11" value="Sim" required> Sim</label>
                            <label><input type="radio" name="p11" value="Nao"> Não</label>
                        </div>
                    </div>

                    <div class="questao-card">
                        <label>12. Apresenta pele macia e aveludada?</label>
                        <div class="radio-opcoes">
                            <label><input type="radio" name="p12" value="Sim" required> Sim</label>
                            <label><input type="radio" name="p12" value="Nao"> Não</label>
                        </div>
                    </div>

                    <div class="questao-card">
                        <label>13. Possui articulações muito flexíveis (hipermobilidade)?</label>
                        <div class="radio-opcoes">
                            <label><input type="radio" name="p13" value="Sim" required> Sim</label>
                            <label><input type="radio" name="p13" value="Nao"> Não</label>
                        </div>
                    </div>

                    <div class="questao-card">
                        <label>14. Apresenta episódios frequentes de insônia ou ansiedade?</label>
                        <div class="radio-opcoes">
                            <label><input type="radio" name="p14" value="Sim" required> Sim</label>
                            <label><input type="radio" name="p14" value="Nao"> Não</label>
                        </div>
                    </div>

                    <div class="questao-card">
                        <label>15. Demonstra descoordenação motora ou dificuldade de equilíbrio?</label>
                        <div class="radio-opcoes">
                            <label><input type="radio" name="p15" value="Sim" required> Sim</label>
                            <label><input type="radio" name="p15" value="Nao"> Não</label>
                        </div>
                    </div>

                    <div style="display: flex; justify-content: space-between; margin-top: 22px;">
                        <a href="Quiz.html"><button type="button" class="btn-secundario">← Voltar</button></a>
                        <button type="button" class="btn-primario" onclick="finalizarQuiz()">Finalizar Questionário</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
